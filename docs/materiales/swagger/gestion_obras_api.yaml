components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Cliente:
      type: object
      properties:
        nombre:
          type: string
        apellidos:
          type: string
        nif:
          type: string
        direccion:
          type: string
        cod_postal:
          type: string
        telefono:
          type: string
    Trabajador:
      type: object
      properties:
        tipo:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        coste_hora_estandar:
          type: number
    Proveedor:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        correo:
          type: string
        tipo:
          type: string
        referencia:
          type: string
        documento:
          type: string
        num_documento:
          type: string
        base:
          type: number
        iva:
          type: number
    Especialista:
      type: object
      properties:
        tipo:
          type: string
        referencia:
          type: string
        comunicacion_parte:
          type: string
        nombre:
          type: string
        notas:
          type: string
        telefono:
          type: string
        correo:
          type: string
        importe:
          type: number
    Falta:
      type: object
      properties:
        fecha_inicio:
          type: string
        fecha_fin:
          type: string
        tipo:
          type: string
        motivo:
          type: string
    Presupuesto:
      type: object
      properties:
        fecha:
          type: string
        cliente_id:
          type: integer
        obra_id:
          type: integer
        nombre_cliente:
          type: string
        nif:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        iva:
          type: number
        estado:
          type: string
        proveedor_ids:
          type: array
          items:
            type: integer
        especialista_ids:
          type: array
          items:
            type: integer
    LineaPresupuesto:
      type: object
      properties:
        descripcion:
          type: string
        uds:
          type: integer
        precio:
          type: number
    Obra:
      type: object
      properties:
        descripcion:
          type: string
        cliente_id:
          type: integer
    Gasto:
      type: object
      properties:
        presupuesto_id:
          type: integer
        direccion_obra:
          type: string
        inicio_obra:
          type: string
        fin_obra:
          type: string
        solicitud_obra:
          type: string
        mandante:
          type: boolean
        gestion_licencia:
          type: boolean
        pago_icio:
          type: boolean
    Ingreso:
      type: object
      properties:
        cliente_id:
          type: integer
        nombre_obra:
          type: string
        tipo:
          type: string
        fecha:
          type: string
        documento:
          type: string
        num_documento:
          type: string
        importe:
          type: number
    ParteTrabajo:
      type: object
      properties:
        fecha:
          type: string
        descripcion:
          type: string
        lineas:
          type: array
          items:
            type: object
    LineaParteTrabajo:
      type: object
      properties:
        trabajador_id:
          type: integer
        horas:
          type: number
        coste_hora:
          type: number
    ParteProveedor:
      type: object
      properties:
        proveedor_id:
          type: integer
        fecha:
          type: string
        descripcion:
          type: string
        documento:
          type: string
        importe:
          type: number
        estado_pago:
          type: string
    ParteEspecialista:
      type: object
      properties:
        especialista_id:
          type: integer
        fecha:
          type: string
        descripcion:
          type: string
        documento:
          type: string
        importe:
          type: number
        estado_pago:
          type: string
