  /tokens:
    post:
      tags: [autenticación]
      summary: Emite un token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Correcto
        '422':
          description: Datos no válidos
    delete:
      tags: [autenticación]
      summary: Revoca el token actual
      responses:
        '204':
          description: Sin contenido
        '401':
          description: Sin autenticar
  /user:
